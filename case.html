    <script>
        (function () {
            const STYLES = {
                light: { paper: '#F2F1EB', ink: '#101116', blue: '#1828CE' },
                dark: { paper: '#101116', ink: '#F2F1EB', blue: '#A0A9FF' }
            };
            const btn = document.getElementById('theme-btn');
            const root = document.documentElement;
            const apply = (mode, animate) => {
                if (animate) {
                    root.classList.add('theme-anim');
                    setTimeout(() => root.classList.remove('theme-anim'), 400);
                }
                root.setAttribute('data-theme', mode);
                btn.textContent = mode === 'dark' ? 'LIGHT' : 'DARK';
                btn.setAttribute('aria-pressed', String(mode === 'dark'));
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', STYLES[mode].paper);
            };
            apply(root.getAttribute('data-theme') || 'light', false);
            btn.addEventListener('click', () => {
                const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                try { localStorage.setItem('sr-theme', next); } catch (e) { /* private mode */ }
                apply(next, true);
            });

            const p = new URLSearchParams(location.search).get('p') || 'elysia';
            renderCaseStudy(p);

            let io;
            if ('IntersectionObserver' in window) {
                io = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            e.target.classList.add('in');
                            io.unobserve(e.target);
                        }
                    });
                }, { threshold: 0.15 });
            }
            document.querySelectorAll('.reveal').forEach(el => { if (io) io.observe(el); });
        })();
    </script>
</body>
